{{- $root := . -}}
{{- range $name := list "web" "api" "intelligence" "ingestor" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crisismesh.fullname" $root }}-{{ $name }}
  labels:
    {{- include "crisismesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ index $root.Values.replicas $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "crisismesh.name" $root }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "crisismesh.name" $root }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "crisismesh.fullname" $root }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ (index $root.Values.images $name).repository }}:{{ (index $root.Values.images $name).tag }}"
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          envFrom:
            - configMapRef: { name: {{ include "crisismesh.fullname" $root }}-config }
            - secretRef: { name: {{ include "crisismesh.fullname" $root }}-secrets }
          {{- if eq $name "web" }}
          env:
            - name: API_INTERNAL_URL
              value: http://{{ include "crisismesh.fullname" $root }}-api:8080
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          {{- else if eq $name "api" }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          {{- else if eq $name "intelligence" }}
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          {{- else }}
          env:
            - name: API_URL
              value: http://{{ include "crisismesh.fullname" $root }}-api:8080
          {{- end }}
          resources:
            {{- toYaml (index $root.Values.resources $name) | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
{{- end }}

