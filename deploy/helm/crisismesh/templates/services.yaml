{{- $root := . -}}
{{- range $name := list "web" "api" "intelligence" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crisismesh.fullname" $root }}-{{ $name }}
  labels:
    {{- include "crisismesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "crisismesh.name" $root }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ (index $root.Values.service $name).port }}
      targetPort: http
---
{{- end }}

