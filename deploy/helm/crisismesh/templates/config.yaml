apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crisismesh.fullname" . }}-config
  labels:
    {{- include "crisismesh.labels" . | nindent 4 }}
data:
  CRISISMESH_ENV: {{ .Values.config.environment | quote }}
  ALLOW_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  INGEST_INTERVAL: {{ .Values.config.ingestInterval | quote }}
  NWS_USER_AGENT: {{ .Values.config.nwsUserAgent | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  INTELLIGENCE_URL: {{ .Values.config.intelligenceUrl | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.config.publicApiUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crisismesh.fullname" . }}-secrets
  labels:
    {{- include "crisismesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  CRISISMESH_API_KEY: {{ required "secrets.apiKey is required" .Values.secrets.apiKey | quote }}
