apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crisismesh.fullname" . }}
  labels:
    {{- include "crisismesh.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.autoscaling.enabled }}
{{- range $name := list "web" "api" "intelligence" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "crisismesh.fullname" $ }}-{{ $name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "crisismesh.fullname" $ }}-{{ $name }} }
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "web" "api" "intelligence" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "crisismesh.fullname" $ }}-{{ $name }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "crisismesh.name" $ }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
